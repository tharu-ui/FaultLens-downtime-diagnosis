# FaultLens Experiment Configuration
# Fixed design: 300 scenarios, 40/20/40 train/val/test split
# 3 original methods + 2 Session 3.5 learned reliability methods, 4 defects ONLY, 4 severities

experiment:
  name: "faultlens_eval_v1"
  master_seed: 42
  num_scenarios: 300
  extra_train_seed: 1337
  extra_train_scenarios: 120
  fresh_test_seed: 4242
  fresh_test_scenarios: 200
  splits:
    train_frac: 0.40
    val_frac: 0.20
    test_frac: 0.40

methods:
  - frequency_baseline
  - confidence_threshold
  - faultlens
  - learned_faultlens
  - confidence_only_learned

defects:
  - missing_events
  - incorrect_reason_codes
  - timestamp_errors
  - duplicate_records

severities:
  - 0.0
  - 0.10
  - 0.20
  - 0.30

diagnoser:
  temperature: 1.0
  calibration:
    method: "platt"  # "isotonic" or "platt"
    n_bins: 10
    clip_min: 0.01
    clip_max: 0.99

stability:
  num_perturbations: 200
  resample_fraction: 0.85
  jitter_std_min: 1.0

quality_scoring:
  weights:
    completeness: 0.20
    reason_validity: 0.20
    duplication: 0.15
    timestamp_consistency: 0.20
    micro_stop_plausibility: 0.10
    alarm_reason_agreement: 0.15
  near_duplicate_window_sec: 60.0
  expected_micro_stop_rate:
    Loader: 0.12
    Press: 0.08
    Welder: 0.10
    Packer: 0.15

policy:
  # Tuned strictly on train+validation splits
  gate_mode: "component"  # "weighted" or "component"
  delta: 0.15
  tau_q: 0.75
  tau_s: 0.80
  buffer: 0.05
  min_coverage: 0.60
  target_coverage: 0.65
  require_margin_ci_positive: false

reliability:
  cv_folds: 5
  target_coverage: 0.65
  model_path: "results/reliability_models.json"
  final_lock_path: "results/final_run.lock"
