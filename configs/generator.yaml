# FaultLens Synthetic Plant Generator Configuration

simulation:
  duration_days: 30
  shifts_per_day: 3
  shift_hours: 8

generator:
  horizon_days: 30
  machines:
    - Loader
    - Press
    - Welder
    - Packer
  causes:
    - jam
    - sensor_fault
    - overheating
    - material_shortage
    - tool_wear
    - electrical_fault

causes:
  - jam
  - sensor_fault
  - overheating
  - material_shortage
  - tool_wear
  - electrical_fault

machines:
  Loader:
    base_mtbf_hours: 10.5
    duration_distribution:
      mean_min: 14.0
      sigma: 0.80
      micro_stop_prob: 0.12
    cause_propensities:
      jam: 0.35
      material_shortage: 0.28
      sensor_fault: 0.15
      electrical_fault: 0.10
      tool_wear: 0.07
      overheating: 0.05
  Press:
    base_mtbf_hours: 13.0
    duration_distribution:
      mean_min: 22.0
      sigma: 0.90
      micro_stop_prob: 0.08
    cause_propensities:
      overheating: 0.32
      tool_wear: 0.28
      electrical_fault: 0.16
      sensor_fault: 0.12
      jam: 0.08
      material_shortage: 0.04
  Welder:
    base_mtbf_hours: 11.5
    duration_distribution:
      mean_min: 18.0
      sigma: 0.85
      micro_stop_prob: 0.10
    cause_propensities:
      electrical_fault: 0.34
      sensor_fault: 0.26
      overheating: 0.18
      tool_wear: 0.12
      jam: 0.06
      material_shortage: 0.04
  Packer:
    base_mtbf_hours: 9.5
    duration_distribution:
      mean_min: 12.0
      sigma: 0.75
      micro_stop_prob: 0.15
    cause_propensities:
      jam: 0.38
      sensor_fault: 0.22
      material_shortage: 0.20
      tool_wear: 0.10
      electrical_fault: 0.06
      overheating: 0.04

alarm_mapping:
  sensor_fault:
    primary: "SENSOR_ALARM"
    secondary: ["CALIBRATION_ERR", "COMM_TIMEOUT"]
  electrical_fault:
    primary: "SENSOR_ALARM"
    secondary: ["POWER_SURGE", "VOLTAGE_DROP"]
  overheating:
    primary: "THERMAL_HIGH"
    secondary: ["TEMP_WARNING", "COOLANT_LOW"]
  jam:
    primary: "FEED_BLOCK"
    secondary: ["TRACK_OBSTRUCTION", "MOTOR_OVERLOAD"]
  tool_wear:
    primary: "WEAR_LIMIT"
    secondary: ["TORQUE_EXCEEDED", "VIBRATION_WARN"]
  material_shortage:
    primary: "HOPPER_LOW"
    secondary: ["FEED_EMPTY", "BUFFER_STARVE"]